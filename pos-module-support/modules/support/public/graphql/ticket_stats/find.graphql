query ($key: String!) {
  records(
    per_page: 20
    filter: {
      table: { value: "modules/support/ticket_stat" }
      properties: [{ name: "key", value: $key }]
    }
    sort: [{ created_at: { order: ASC } }, { id: { order: ASC } }]
  ) {
    results {
      id
      counted_at: property(name: "counted_at")
      counts: property(name: "counts")
    }
  }
}
